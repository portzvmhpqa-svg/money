<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时打工收益水表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Syne & Space Grotesk (匹配参考图片的极简宽体科技感字体) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e6e9ef;
            --neu-flat: #e6e9ef;
            --shadow-light: #ffffff;
            --shadow-dark: #c1c7d0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            color: #2d3748;
        }

        .font-syne {
            font-family: 'Syne', sans-serif;
        }

        /* 凸起卡片 / 按钮 */
        .neu-raised {
            background: var(--neu-flat);
            box-shadow: 9px 9px 18px var(--shadow-dark),
                       -9px -9px 18px var(--shadow-light);
        }

        .neu-raised-sm {
            background: var(--neu-flat);
            box-shadow: 4px 4px 10px var(--shadow-dark),
                       -4px -4px 10px var(--shadow-light);
        }

        /* 凹陷面板 (内阴影) */
        .neu-inset {
            background: var(--neu-flat);
            box-shadow: inset 5px 5px 10px var(--shadow-dark),
                        inset -5px -5px 10px var(--shadow-light);
        }

        .neu-inset-deep {
            background: #e0e4ec;
            box-shadow: inset 7px 7px 14px #bcbece,
                        inset -7px -7px 14px #ffffff;
        }

        /* 按压交互反馈 */
        .neu-btn {
            transition: all 0.2s ease;
        }
        .neu-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark),
                        inset -3px -3px 6px var(--shadow-light);
        }

        /* 进度条轨道与填充 */
        .neu-progress-track {
            box-shadow: inset 2px 2px 5px var(--shadow-dark),
                        inset -2px -2px 5px var(--shadow-light);
        }
        
        .neu-progress-fill {
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.15);
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-slate-300">

    <!-- 主外框卡片 (模仿参考图的大圆角 Soft UI 容器) -->
    <div class="w-full max-w-md p-7 rounded-[40px] neu-raised flex flex-col gap-6 relative transition-all duration-300">
        
        <!-- 头部卡片栏 -->
        <div class="flex items-center justify-between px-1 pt-1">
            <div class="flex flex-col">
                <span class="text-[11px] font-bold tracking-widest text-slate-400 uppercase">EARNINGS COUNTER</span>
                <h1 class="text-xl font-extrabold font-syne tracking-tight text-slate-800">打工实时水表</h1>
            </div>
            
            <!-- 设置按钮 (凸起胶囊状) -->
            <button id="openSettingsBtn" class="w-11 h-11 rounded-full neu-raised-sm neu-btn flex items-center justify-center text-slate-600 hover:text-slate-900" title="设置参数">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>

        <!-- 顶部突出数值面板 (参考图中 T.029 面板的凹陷风格) -->
        <div class="p-6 rounded-[28px] neu-inset-deep flex flex-col gap-2 relative overflow-hidden">
            <div class="flex items-center justify-between text-xs font-semibold text-slate-400">
                <span class="tracking-wide">TODAY'S ACCUMULATED</span>
                <span class="px-2.5 py-0.5 rounded-full neu-raised-sm text-[10px] text-slate-500 font-bold">CNY</span>
            </div>

            <!-- 金额核心显示区（4位小数，匹配 Syne 极简宽体字体） -->
            <div class="font-syne text-4xl sm:text-5xl font-extrabold text-slate-800 tracking-tight my-1 flex items-baseline gap-1">
                <span class="text-2xl sm:text-3xl font-semibold text-slate-500">￥</span>
                <span id="earningsDisplay" class="tracking-tighter">0.0000</span>
            </div>

            <!-- 进度条 -->
            <div class="w-full bg-transparent h-2.5 rounded-full neu-progress-track p-0.5 mt-2 flex items-center">
                <div id="progressBar" class="bg-slate-700 h-full rounded-full w-0 neu-progress-fill transition-all duration-300"></div>
            </div>
        </div>

        <!-- 中部功能区域 (参考图中左侧圆环与右侧多功能小卡片的并列布局) -->
        <div class="grid grid-cols-5 gap-4 items-stretch">
            
            <!-- 左侧：状态环状/圆形指示卡片 (占 3 列) -->
            <div class="col-span-3 p-5 rounded-[28px] neu-inset flex flex-col justify-between items-center text-center relative">
                <div class="w-full flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                    <span>STATUS</span>
                    <span id="percentText" class="text-slate-700 font-syne text-xs font-bold">0.0%</span>
                </div>

                <div class="my-3 flex flex-col items-center">
                    <div id="statusIcon" class="w-12 h-12 rounded-full neu-raised-sm flex items-center justify-center text-xl mb-2 text-slate-700">
                        ☕
                    </div>
                    <span id="statusBadge" class="font-syne font-bold text-sm text-slate-800 tracking-tight">尚未上班</span>
                </div>

                <div class="text-[10px] text-slate-400 font-medium">工时进度计算</div>
            </div>

            <!-- 右侧：速率及目标提示 (占 2 列) -->
            <div class="col-span-2 flex flex-col gap-4">
                <!-- 秒速卡片 -->
                <div class="p-4 rounded-[22px] neu-raised-sm flex flex-col justify-center gap-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">SPEED</span>
                    <span id="ratePerSecond" class="font-syne font-bold text-xs text-slate-700">￥0.0000/s</span>
                </div>
                <!-- 目标薪资卡片 -->
                <div class="p-4 rounded-[22px] neu-raised-sm flex flex-col justify-center gap-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">TARGET</span>
                    <span id="targetSalaryText" class="font-syne font-bold text-xs text-slate-700">￥0.00</span>
                </div>
            </div>
        </div>

        <!-- 底部长条触感按钮组 (匹配参考图中最下方的 upload 凹槽按钮) -->
        <div class="w-full p-2.5 rounded-[26px] neu-inset flex items-center justify-between gap-3">
            <div class="flex-1 px-4 py-3 rounded-full neu-raised-sm flex items-center justify-center text-xs font-bold font-syne text-slate-600 gap-2">
                <span>⏱️</span>
                <span>REALTIME METRIC ENGINE</span>
            </div>
            <div class="w-10 h-10 rounded-full neu-raised-sm flex items-center justify-center text-slate-500 font-bold text-xs">
                24H
            </div>
        </div>

    </div>

    <!-- 参数设置弹窗 (新拟物 Modal) -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="w-full max-w-sm p-7 rounded-[36px] neu-raised relative flex flex-col gap-5 text-slate-700">
            <div class="flex items-center justify-between pb-2 border-b border-slate-300/60">
                <h2 class="text-lg font-bold font-syne text-slate-800 flex items-center gap-2">
                    <span>⚙️</span> 参数配置
                </h2>
                <button type="button" id="closeSettingsBtn" class="w-8 h-8 rounded-full neu-raised-sm neu-btn flex items-center justify-center text-xs font-bold text-slate-500">
                    ✕
                </button>
            </div>

            <form id="settingsForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">每日薪资 (元)</label>
                    <input type="number" id="inputSalary" step="0.01" required
                        class="w-full neu-inset rounded-2xl px-4 py-2.5 text-sm font-syne font-bold text-slate-800 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">上班时间</label>
                        <input type="time" id="inputStartTime" required
                            class="w-full neu-inset rounded-2xl px-3 py-2 text-xs font-syne font-semibold text-slate-800 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">下班时间</label>
                        <input type="time" id="inputEndTime" required
                            class="w-full neu-inset rounded-2xl px-3 py-2 text-xs font-syne font-semibold text-slate-800 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">午休开始</label>
                        <input type="time" id="inputLunchStart" required
                            class="w-full neu-inset rounded-2xl px-3 py-2 text-xs font-syne font-semibold text-slate-800 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">午休结束</label>
                        <input type="time" id="inputLunchEnd" required
                            class="w-full neu-inset rounded-2xl px-3 py-2 text-xs font-syne font-semibold text-slate-800 focus:outline-none">
                    </div>
                </div>

                <div class="pt-3">
                    <button type="submit"
                        class="w-full py-3 rounded-2xl neu-raised-sm neu-btn text-xs font-bold font-syne text-slate-800 uppercase tracking-wider">
                        保存并立即生效
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 逻辑 -->
    <script>
        // 默认配置
        const DEFAULT_CONFIG = {
            dailySalary: 150,
            startTime: "09:00",
            endTime: "18:00",
            lunchStart: "12:00",
            lunchEnd: "14:00"
        };

        // 从 LocalStorage 读取配置
        let config = JSON.parse(localStorage.getItem('earnings_meter_config')) || DEFAULT_CONFIG;

        // DOM 元素引用
        const earningsDisplay = document.getElementById('earningsDisplay');
        const progressBar = document.getElementById('progressBar');
        const statusBadge = document.getElementById('statusBadge');
        const statusIcon = document.getElementById('statusIcon');
        const ratePerSecond = document.getElementById('ratePerSecond');
        const targetSalaryText = document.getElementById('targetSalaryText');
        const percentText = document.getElementById('percentText');

        const settingsModal = document.getElementById('settingsModal');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsForm = document.getElementById('settingsForm');

        const inputSalary = document.getElementById('inputSalary');
        const inputStartTime = document.getElementById('inputStartTime');
        const inputEndTime = document.getElementById('inputEndTime');
        const inputLunchStart = document.getElementById('inputLunchStart');
        const inputLunchEnd = document.getElementById('inputLunchEnd');

        // 打开/关闭设置窗口
        openSettingsBtn.addEventListener('click', () => {
            inputSalary.value = config.dailySalary;
            inputStartTime.value = config.startTime;
            inputEndTime.value = config.endTime;
            inputLunchStart.value = config.lunchStart;
            inputLunchEnd.value = config.lunchEnd;
            settingsModal.classList.remove('hidden');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        // 保存设置
        settingsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            config = {
                dailySalary: parseFloat(inputSalary.value) || 0,
                startTime: inputStartTime.value,
                endTime: inputEndTime.value,
                lunchStart: inputLunchStart.value,
                lunchEnd: inputLunchEnd.value
            };
            localStorage.setItem('earnings_meter_config', JSON.stringify(config));
            settingsModal.classList.add('hidden');
            updateMeter();
        });

        // 时间转换解析函数 (HH:MM -> 今日 Date 对象)
        function parseTimeString(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0, 0);
        }

        // 核心打工计算逻辑
        function updateMeter() {
            const now = new Date();
            const startDt = parseTimeString(config.startTime);
            const endDt = parseTimeString(config.endTime);
            const lunchStartDt = parseTimeString(config.lunchStart);
            const lunchEndDt = parseTimeString(config.lunchEnd);

            // 总工时计算 (扣除午休, 单位: 秒)
            const totalSeconds = (endDt - startDt) / 1000;
            const lunchSeconds = Math.max(0, (lunchEndDt - lunchStartDt) / 1000);
            const effectiveTotalSeconds = Math.max(1, totalSeconds - lunchSeconds);

            // 每秒收益率
            const rate = config.dailySalary / effectiveTotalSeconds;
            ratePerSecond.textContent = `￥${rate.toFixed(4)}/s`;
            targetSalaryText.textContent = `￥${config.dailySalary.toFixed(2)}`;

            let workedSeconds = 0;
            let statusText = "打工中";
            let iconStr = "💪";

            if (now < startDt) {
                workedSeconds = 0;
                statusText = "尚未上班";
                iconStr = "☕";
            } else if (now >= endDt) {
                workedSeconds = effectiveTotalSeconds;
                statusText = "已下班";
                iconStr = "🎉";
            } else {
                // 处于上班时间内
                const rawWorked = (now - startDt) / 1000;
                if (now < lunchStartDt) {
                    workedSeconds = rawWorked;
                    statusText = "努力打工";
                    iconStr = "💼";
                } else if (now >= lunchStartDt && now < lunchEndDt) {
                    workedSeconds = (lunchStartDt - startDt) / 1000;
                    statusText = "午休充电";
                    iconStr = "🍱";
                } else {
                    workedSeconds = rawWorked - lunchSeconds;
                    statusText = "努力打工";
                    iconStr = "⚡";
                }
            }

            // 计算收益与百分比
            const currentEarnings = workedSeconds * rate;
            const percentage = Math.min(100, Math.max(0, (workedSeconds / effectiveTotalSeconds) * 100));

            // 更新 UI 数字 (精确到 4 位小数)
            earningsDisplay.textContent = currentEarnings.toFixed(4);
            progressBar.style.width = `${percentage}%`;
            percentText.textContent = `${percentage.toFixed(1)}%`;
            statusBadge.textContent = statusText;
            statusIcon.textContent = iconStr;
        }

        // 高频刷新器 (每秒刷新 30 次以实现平滑水表滚动效果)
        setInterval(updateMeter, 33);
        updateMeter();
    </script>
</body>
</html>
